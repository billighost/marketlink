<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Icons & Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme & Mobile App Meta -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Pre-order fresh produce from local farmers markets and pick it up in person." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MarketLink" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph & Twitter Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MarketLink — Farm fresh, just a click away" />
    <meta property="og:description" content="Pre-order fresh produce from local farmers markets and pick it up in person." />
    <meta property="og:image" content="/social/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social/og-image.png" />

    <title>MarketLink · Farm fresh, just a click away</title>

    <!-- Local Font: Idiqlat (Brand Heading Serif) -->
    <link rel="preload" href="/fonts/Idiqlat/Idiqlat-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Google Fonts: Inter (Body & UI) & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
